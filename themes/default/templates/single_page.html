{% extends "public_base.html" %}
{% block content %}
<article class="max-w-3xl mx-auto px-6 py-16">
  <a href="/" class="text-sm text-slate-400 hover:text-white transition-colors inline-flex items-center gap-2 mb-8">
    <i class="fa-solid fa-arrow-left text-xs"></i> Home
  </a>
  <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-6">{{ item.title }}</h1>
  <div class="prose-body bg-dark-card border border-dark-border rounded-2xl p-6 sm:p-8">{{ item.body | safe }}</div>
</article>
{% endblock %}
