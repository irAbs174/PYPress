{% extends "public_base.html" %}
{% block content %}
<section>
  <h1>{{ archive_title }}</h1>
  {% if posts %}
    {% for post in posts %}
    <article class="post-card">
      <h2><a href="/posts/{{ post.slug }}">{{ post.title }}</a></h2>
      {% if post.excerpt %}
      <p>{{ post.excerpt }}</p>
      {% endif %}
    </article>
    {% endfor %}
  {% else %}
  <p>No posts in this archive.</p>
  {% endif %}
</section>
{% endblock %}
