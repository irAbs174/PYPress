{% extends "admin/base.html" %}
{% block title %}Maintenance | PYpress{% endblock %}
{% block page_heading %}Maintenance mode{% endblock %}
{% block content %}
<section class="section-header mb-6">
  <div>
    <p class="text-textmuted">Show a public maintenance page while staff keep working in admin.</p>
  </div>
</section>

{% if saved %}
<div class="mb-4 px-3 py-2 rounded-lg bg-green-500/10 text-green-400 border border-green-500/20 text-sm">
  Maintenance settings saved.
</div>
{% endif %}

<form method="post" action="/admin/maintenance" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  <section class="bg-cardbg border border-cardborder rounded-xl p-6 stack">
    <label class="checkbox-row">
      <input type="checkbox" name="enabled" {% if config.enabled %}checked{% endif %} />
      <span>Enable maintenance mode</span>
    </label>
    <label>
      <span>Title</span>
      <input type="text" name="title" value="{{ config.title }}" required />
    </label>
    <label>
      <span>Message</span>
      <textarea name="message" rows="4" required>{{ config.message }}</textarea>
    </label>
    <button type="submit">Save</button>
  </section>
</form>
{% endblock %}
